<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>EGY-SCOUT Coach Pro · Lovio-Style Live Motion Stage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #F6F9FE;
      color: #0F172A;
      font-family: 'Cairo', 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Sunlit Lovio horizon backdrop + soft organic light rays */
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background:
        radial-gradient(1100px 680px at 78% 12%, rgba(56, 189, 248, 0.22) 0%, rgba(255,255,255,0) 68%),
        radial-gradient(960px 660px at 16% 88%, rgba(15, 181, 174, 0.18) 0%, rgba(255,255,255,0) 70%),
        linear-gradient(155deg, #FFFFFF 0%, #F1F6FC 54%, #E8F2FC 100%);
      overflow: hidden;
    }

    /* Sunlit diagonal window light rays (Lovio hero ambiance, purely CSS gradients) */
    .sun-beam {
      position: absolute;
      width: 440px;
      height: 1400px;
      background: linear-gradient(180deg, rgba(255,255,255,0.68) 0%, rgba(255,255,255,0) 85%);
      transform: rotate(28deg);
      pointer-events: none;
      filter: blur(22px);
      z-index: 2;
    }

    /* Subtle top-left watermark logo (matching Lovio "zelios") */
    .corner-brand {
      position: absolute;
      top: 38px;
      left: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 40;
      opacity: 0.72;
      direction: ltr;
    }
    .corner-wordmark {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.03em;
      color: #0B1F3A;
    }
    .corner-wordmark span { color: #0FB5AE; }

    .scene-layer {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Sleek macOS / Lovio glossy glass UI window */
    .lovio-frame {
      position: relative;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 26px;
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 45px 100px -20px rgba(15, 23, 42, 0.22),
        0 18px 40px -12px rgba(0, 102, 255, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      overflow: hidden;
    }
    .lovio-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grad-text {
      background: linear-gradient(95deg, #0055FF 0%, #0FB5AE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    .glass-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.10);
      font-weight: 700;
      font-size: 20px;
      color: #0F172A;
    }
    .crest-chip {
      width: 108px;
      height: 108px;
      border-radius: 28px;
      background: #FFFFFF;
      border: 1px solid rgba(15, 23, 42, 0.07);
      box-shadow: 0 24px 52px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .crest-badge {
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="sun-beam" id="beam1" style="top:-360px;left:340px;"></div>
    <div class="sun-beam" id="beam2" style="top:-320px;left:1080px;"></div>

    <div class="corner-brand" id="corner-brand">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
        <rect x="2" y="3" width="29" height="21" rx="3" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2.2"/>
        <rect x="4.5" y="5.5" width="24" height="16" rx="1.5" fill="#0B1F3A"/>
        <rect x="6" y="7" width="4" height="2" fill="#0FB5AE"/>
        <path d="M9.5 11.5V15.5H23.5V11.5" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="square"/>
        <polygon points="16.5,17 18.7,19.2 16.5,21.4 14.3,19.2" fill="#E0A526"/>
        <rect x="13.5" y="24" width="6" height="4" fill="#0B1F3A"/>
        <rect x="10" y="28" width="13" height="2.6" fill="#0B1F3A"/>
      </svg>
      <div class="corner-wordmark">be<span>digital</span></div>
    </div>

    <div class="scene-layer" id="scene-root"></div>
  </div>

  <script>
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const easeOutExpo = (x) => {
      const t = clamp(x, 0, 1);
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    };
    const easeInOutCubic = (x) => {
      const t = clamp(x, 0, 1);
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };
    const springEase = (x) => {
      const t = clamp(x, 0, 1);
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };
    const esc = (s) =>
      String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    function animatedBedigitalLogo(size = 112, t = 1) {
      // Lovio-style 4-stage choreographed reveal: sparkle -> monitor frame -> Ba stroke -> gold diamond pulse
      const frameScale = springEase(t / 0.32);
      const baDash = clamp((t - 0.16) / 0.28, 0, 1);
      const nuqtaScale = t < 0.34 ? 0 : springEase((t - 0.34) / 0.28);
      const glow = 0.35 + 0.35 * Math.sin(t * 6);
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 36 36" fill="none" style="flex-shrink:0;filter:drop-shadow(0 14px 28px rgba(15,181,174,${glow.toFixed(2)}));transform:scale(${frameScale.toFixed(4)})">
          <rect x="4" y="6" width="29" height="21" rx="3" fill="#0FB5AE" fill-opacity="0.22"/>
          <rect x="2" y="3" width="29" height="21" rx="3" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2.1"/>
          <rect x="4.5" y="5.5" width="24" height="16" rx="1.5" fill="#0B1F3A"/>
          <rect x="6" y="7" width="${(4.5 * baDash).toFixed(2)}" height="2" fill="#0FB5AE"/>
          <path d="M9.5 11.5V15.5H23.5V11.5" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="square"
            stroke-dasharray="28" stroke-dashoffset="${((1 - baDash) * 28).toFixed(2)}"/>
          <polygon points="16.5,17 19.1,19.6 16.5,22.2 13.9,19.6" fill="#E0A526"
            style="transform-origin:16.5px 19.6px;transform:scale(${nuqtaScale.toFixed(3)})"/>
          <rect x="13.5" y="24" width="6" height="4" fill="#0B1F3A"/>
          <rect x="10" y="28" width="13" height="2.6" fill="#0B1F3A"/>
        </svg>`;
    }

    function wordReveal(text, localTime, delay, highlight = false, size = 62) {
      const p = springEase((localTime - delay) / 0.32);
      const o = clamp((localTime - delay) / 0.14, 0, 1);
      return `
        <div style="overflow:hidden;display:inline-block;">
          <div class="${highlight ? "grad-text" : ""}" style="
            font-size:${size}px;
            font-weight:${highlight ? 900 : 700};
            line-height:1.15;
            transform:translate3d(0,${((1 - p) * 52).toFixed(1)}px,0);
            opacity:${o.toFixed(3)};
          ">${esc(text)}</div>
        </div>`;
    }

    window.__frameImgLoaded = new Map();
    async function preloadDataUri(uri) {
      if (!uri || window.__frameImgLoaded.get(uri) === true) return;
      await new Promise((res) => {
        const im = new Image();
        im.onload = () => { window.__frameImgLoaded.set(uri, true); res(); };
        im.onerror = res;
        im.src = uri;
      });
    }

    window.renderFrame = async function ({
      lang,
      sceneIdx,
      totalScenes,
      scene,
      crests,
      localTime,
      globalProgress,
      liveFrameDataUri,
    }) {
      await preloadDataUri(liveFrameDataUri);

      const isAr = lang === "ar";
      const dir = isAr ? "rtl" : "ltr";
      const dur = Math.max(1.2, scene.duration_s || 4.0);
      const enter = easeOutExpo(localTime / 0.26);
      const exit = localTime > dur - 0.16 ? easeOutExpo((dur - localTime) / 0.16) : 1;
      const alpha = clamp(Math.min(enter * 1.15, exit), 0, 1);

      // Gentle sunlit studio rays shift
      document.getElementById("beam1").style.left = `${300 + Math.sin(globalProgress * 4) * 90}px`;
      document.getElementById("beam2").style.left = `${1060 + Math.cos(globalProgress * 3) * 110}px`;

      const tpl = scene.template;
      const cornerBrand = document.getElementById("corner-brand");
      cornerBrand.style.display = tpl === "lovio_logo_reveal" || tpl === "lovio_end_card" ? "none" : "flex";

      const root = document.getElementById("scene-root");

      // 1. Animated bedigital Logo Sting -> EGY-SCOUT Coach Pro (Lovio Frame 1-3 glow)
      if (tpl === "lovio_logo_reveal") {
        const morphSlide = easeOutExpo((localTime - 0.48) / 0.45);
        const pillO = easeOutExpo((localTime - 0.72) / 0.35);
        const haloScale = 0.8 + 0.5 * easeOutExpo(localTime / 1.2);
        root.innerHTML = `
          <div style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:${alpha};">
            <div style="position:absolute;width:620px;height:620px;border-radius:9999px;background:radial-gradient(circle,rgba(15,181,174,0.22),rgba(0,85,255,0.08),transparent 72%);filter:blur(40px);transform:scale(${haloScale.toFixed(3)});pointer-events:none;"></div>
            <div dir="ltr" style="position:relative;z-index:2;display:flex;align-items:center;gap:26px;">
              ${animatedBedigitalLogo(122, localTime)}
              <div style="overflow:hidden;max-width:${(morphSlide * 980).toFixed(0)}px;white-space:nowrap;">
                <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:78px;font-weight:800;letter-spacing:-0.03em;color:#0F172A;line-height:1.05;">
                  EGY-SCOUT <span class="grad-text">Coach Pro</span>
                </div>
              </div>
            </div>
            <div class="glass-pill" style="opacity:${pillO};transform:translateY(${((1 - pillO) * 14).toFixed(1)}px);font-size:22px;padding:11px 28px;">
              <span style="width:10px;height:10px;border-radius:9999px;background:#0FB5AE;display:inline-block;"></span>
              <span>bedigital · 2026/27 Live Football Suite</span>
            </div>
          </div>`;
        return;
      }

      // 2. Multi-League Animated Club Crests -> Live Switching Across Multiple Leagues (Lovio Frame 14)
      if (tpl === "lovio_multi_leagues") {
        const showLiveHub = localTime >= 1.55;
        if (!showLiveHub) {
          const bracketSpread = easeOutExpo(localTime / 0.55);
          const list = crests || [];
          root.innerHTML = `
            <div dir="${dir}" style="width:1720px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;opacity:${alpha};text-align:center;">
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
                ${wordReveal(scene.headline, localTime, 0.0, false, 64)}
                ${wordReveal(scene.highlight, localTime, 0.12, true, 72)}
              </div>
              <div dir="ltr" style="display:flex;align-items:center;justify-content:center;gap:${(14 + bracketSpread * 16).toFixed(1)}px;">
                <span style="font-family:'Plus Jakarta Sans';font-size:118px;font-weight:300;color:#0FB5AE;opacity:${bracketSpread};">{</span>
                ${list
                  .map((c, idx) => {
                    const p = springEase((localTime - 0.14 - idx * 0.08) / 0.34);
                    const o = clamp((localTime - 0.14 - idx * 0.08) / 0.16, 0, 1);
                    const floatY = Math.sin(localTime * 3.5 + idx) * 6;
                    return `
                      <div class="crest-chip" style="opacity:${o};transform:translateY(${((1 - p) * 30 + floatY).toFixed(1)}px) scale(${(0.84 + 0.16 * p).toFixed(3)});">
                        <div class="crest-badge" style="background:${c.hex};">${esc(c.short)}</div>
                        <span style="font-size:15px;font-weight:800;color:#0F172A;">${esc(c.label)}</span>
                      </div>`;
                  })
                  .join("")}
                <span style="font-family:'Plus Jakarta Sans';font-size:118px;font-weight:300;color:#0055FF;opacity:${bracketSpread};">}</span>
              </div>
              <div style="font-size:25px;font-weight:600;color:#475569;">${esc(scene.sub)}</div>
            </div>`;
        } else {
          const tLive = localTime - 1.55;
          const sc = 0.94 + 0.06 * easeOutExpo(tLive / 0.35);
          root.innerHTML = `
            <div dir="${dir}" style="width:1760px;height:900px;display:flex;align-items:center;justify-content:space-between;gap:46px;opacity:${alpha};">
              <div style="width:450px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;">
                ${wordReveal(scene.headline, localTime, 0.0, false, 56)}
                ${wordReveal(scene.highlight, localTime, 0.12, true, 62)}
                <div style="font-size:23px;font-weight:600;color:#475569;line-height:1.45;margin-top:8px;">${esc(scene.sub)}</div>
              </div>
              <div class="lovio-frame" style="flex:1;height:760px;transform:scale(${sc.toFixed(4)});">
                <img src="${liveFrameDataUri}" alt="" style="object-position:top center;" />
              </div>
            </div>`;
        }
        return;
      }

      // 3. LIVE AI Prompt Typing -> 3-4-2-1 Drawing with Passes (Lovio Frame 2 & 6)
      if (tpl === "lovio_prompt_live") {
        const prompt = scene.prompt || "";
        const preIntro = localTime < 1.15;
        if (preIntro) {
          const frac = clamp(localTime / 0.95, 0, 1);
          const chars = Math.max(1, Math.floor(prompt.length * frac));
          const sc = 0.9 + 0.1 * springEase(localTime / 0.35);
          root.innerHTML = `
            <div dir="${dir}" style="width:1400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:${alpha};transform:scale(${sc.toFixed(4)});text-align:center;">
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
                ${wordReveal(scene.headline, localTime, 0.0, false, 64)}
                ${wordReveal(scene.highlight, localTime, 0.10, true, 72)}
              </div>
              <div style="width:980px;padding:22px 30px;border-radius:9999px;background:rgba(255,255,255,0.88);backdrop-filter:blur(18px);border:2px solid rgba(15,181,174,0.65);box-shadow:0 28px 70px rgba(0,85,255,0.16);display:flex;align-items:center;justify-content:space-between;gap:16px;">
                <span style="font-size:28px;font-weight:700;color:#0F172A;">${esc(prompt.slice(0, chars))}<span style="color:#0FB5AE;">|</span></span>
                <span style="padding:10px 26px;border-radius:9999px;background:linear-gradient(95deg,#0055FF,#0FB5AE);color:#FFFFFF;font-size:20px;font-weight:800;">AI</span>
              </div>
            </div>`;
        } else {
          const z = 1.0 + 0.14 * easeInOutCubic((localTime - 1.15) / (dur - 1.15));
          const crop = scene.crop || { ox: "50%", oy: "50%" };
          root.innerHTML = `
            <div dir="${dir}" style="width:1760px;height:900px;display:flex;align-items:center;justify-content:space-between;gap:42px;opacity:${alpha};">
              <div style="width:430px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;">
                <div class="glass-pill" style="align-self:flex-start;font-size:17px;padding:8px 18px;">
                  <span style="width:9px;height:9px;border-radius:9999px;background:#0FB5AE;display:inline-block;"></span>
                  <span>3-4-2-1 · AI Live</span>
                </div>
                ${wordReveal(scene.headline, localTime, 0.0, false, 54)}
                ${wordReveal(scene.highlight, localTime, 0.1, true, 60)}
                <div style="font-size:22px;font-weight:600;color:#475569;line-height:1.45;margin-top:6px;">${esc(scene.sub)}</div>
              </div>
              <div class="lovio-frame" style="flex:1;height:780px;">
                <img src="${liveFrameDataUri}" alt="" style="transform-origin:${crop.ox} ${crop.oy};transform:scale(${z.toFixed(4)});" />
              </div>
            </div>`;
        }
        return;
      }

      // 4. LIVE 3-Phase Split Bento (Possession -> Attack -> Defense live morph sync)
      if (tpl === "lovio_bento_phases") {
        const phases = scene.phases || [];
        // Synchronized cleanly to capture_live_clips phase clicks (~0..20% Possession, 20..44% Attack, 44..68% Defense, 68..100% Morphing)
        const frac = clamp(localTime / dur, 0, 1);
        const activeIdx = frac < 0.22 ? 0 : frac < 0.45 ? 1 : frac < 0.72 ? 2 : Math.floor((frac * 9) % 3);
        root.innerHTML = `
          <div dir="${dir}" style="width:1760px;height:860px;display:flex;align-items:stretch;gap:28px;opacity:${alpha};">
            <div class="lovio-frame" style="flex:1.45;height:100%;">
              <img src="${liveFrameDataUri}" alt="" style="transform-origin:42% 62%;transform:scale(1.14);" />
            </div>
            <div style="flex:0.75;border-radius:28px;background:linear-gradient(155deg,#0B4F5C 0%,#0FB5AE 100%);padding:44px 36px;display:flex;flex-direction:column;justify-content:center;gap:20px;color:#FFFFFF;box-shadow:0 32px 72px rgba(14,165,164,0.28);">
              <div>
                <div style="font-size:44px;font-weight:600;line-height:1.15;opacity:0.92;">${esc(scene.headline)}</div>
                <div style="font-size:52px;font-weight:900;line-height:1.15;">${esc(scene.highlight)}</div>
              </div>
              <div style="font-size:21px;opacity:0.86;">${esc(scene.sub)}</div>
              <div style="display:flex;flex-direction:column;gap:12px;margin-top:4px;">
                ${phases
                  .map((ph, idx) => {
                    const isAct = idx === activeIdx;
                    return `
                      <div style="
                        padding:16px 22px;
                        border-radius:18px;
                        background:${isAct ? "#FFFFFF" : "rgba(255,255,255,0.14)"};
                        color:${isAct ? "#0B1F3A" : "#FFFFFF"};
                        font-size:23px;
                        font-weight:800;
                        transform:scale(${isAct ? 1.04 : 0.99});
                        box-shadow:${isAct ? "0 16px 32px rgba(0,0,0,0.16)" : "none"};
                      ">${esc(ph)}</div>`;
                  })
                  .join("")}
              </div>
            </div>
          </div>`;
        return;
      }

      // 5. Sleek Lovio 3D Device Playing Live Action Clip (Command / Formats / Edit)
      if (tpl === "lovio_device_live") {
        const glide = easeInOutCubic(localTime / dur);
        const rx = 8 - 6.5 * glide;
        const ry = (isAr ? 9 : -9) * (1 - 0.72 * glide);
        const sc = 0.96 + 0.04 * springEase(localTime / 0.35);
        root.innerHTML = `
          <div dir="${dir}" style="width:1760px;height:900px;display:flex;align-items:center;justify-content:space-between;gap:46px;opacity:${alpha};">
            <div style="width:450px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;">
              ${wordReveal(scene.headline, localTime, 0.0, false, 56)}
              ${wordReveal(scene.highlight, localTime, 0.12, true, 62)}
              <div style="font-size:23px;font-weight:600;color:#475569;line-height:1.45;margin-top:8px;">${esc(scene.sub)}</div>
            </div>
            <div style="flex:1;height:780px;display:flex;align-items:center;justify-content:center;">
              <div class="lovio-frame" style="width:1200px;height:750px;transform:perspective(1650px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) scale(${sc.toFixed(4)});">
                <img src="${liveFrameDataUri}" alt="" />
              </div>
            </div>
          </div>`;
        return;
      }

      // 6. Full Video Analysis Studio Alpha/Beta Showcase
      if (tpl === "lovio_alpha_live") {
        const feats = isAr
          ? ["تتبع اللاعبين", "رادار 2D", "xPass والتمرير", "مؤشر الضغط", "وسم اللقطات"]
          : ["Player Tracking", "2D Tactical Radar", "Passing xPass%", "Match Momentum", "Clip Tagging"];
        const sc = 0.95 + 0.05 * springEase(localTime / 0.36);
        root.innerHTML = `
          <div dir="${dir}" style="width:1760px;height:900px;display:flex;align-items:center;justify-content:space-between;gap:46px;opacity:${alpha};">
            <div style="width:470px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;">
              <div class="glass-pill" style="align-self:flex-start;background:#0F172A;color:#FFFFFF;border:none;font-size:17px;padding:8px 18px;">
                ${esc(scene.badge || "Alpha / Beta")}
              </div>
              ${wordReveal(scene.headline, localTime, 0.0, false, 50)}
              ${wordReveal(scene.highlight, localTime, 0.12, true, 54)}
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
                ${feats
                  .map((f, i) => {
                    const o = clamp((localTime - 0.18 - i * 0.12) / 0.2, 0, 1);
                    return `<span class="glass-pill" style="font-size:16px;padding:7px 14px;opacity:${o};">${esc(f)}</span>`;
                  })
                  .join("")}
              </div>
            </div>
            <div class="lovio-frame" style="flex:1;height:760px;background:#0B1220;transform:scale(${sc.toFixed(4)});">
              <img src="${liveFrameDataUri}" alt="" style="transform-origin:52% 45%;transform:scale(1.06);" />
            </div>
          </div>`;
        return;
      }

      // 7. End Card (Lovio outro)
      const sc = springEase(localTime / 0.36);
      const subO = easeOutExpo((localTime - 0.28) / 0.3);
      root.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:${alpha};gap:24px;">
          <div dir="ltr" style="display:flex;align-items:center;gap:22px;transform:scale(${sc.toFixed(4)});">
            ${animatedBedigitalLogo(96, 1.0)}
            <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:74px;font-weight:800;letter-spacing:-0.03em;color:#0F172A;">
              EGY-SCOUT <span class="grad-text">Coach Pro</span>
            </div>
          </div>
          <div dir="${dir}" style="font-size:40px;font-weight:800;color:#0F172A;opacity:${subO};">${esc(scene.highlight)}</div>
          <div class="glass-pill" style="padding:12px 32px;font-size:21px;opacity:${subO};">
            ${esc(scene.sub)}
          </div>
        </div>`;
    };
  </script>
</body>
</html>
