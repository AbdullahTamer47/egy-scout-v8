<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>EGY-SCOUT Coach Pro · TRUE Lovio V4 Motion Stage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #F6FAFE;
      color: #0F172A;
      font-family: 'Cairo', 'IBM Plex Sans Arabic', 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background:
        radial-gradient(1200px 720px at 80% 10%, rgba(56, 189, 248, 0.22) 0%, rgba(255,255,255,0) 68%),
        radial-gradient(1000px 700px at 15% 90%, rgba(15, 181, 174, 0.18) 0%, rgba(255,255,255,0) 70%),
        linear-gradient(155deg, #FFFFFF 0%, #F2F7FD 54%, #E8F2FC 100%);
      overflow: hidden;
    }

    .sun-beam {
      position: absolute;
      width: 460px;
      height: 1450px;
      background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0) 85%);
      transform: rotate(28deg);
      pointer-events: none;
      filter: blur(22px);
      z-index: 2;
    }

    .corner-brand {
      position: absolute;
      top: 32px;
      left: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 40;
      opacity: 0.78;
      direction: ltr;
    }
    .corner-wordmark {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.03em;
      color: #0B1F3A;
    }
    .corner-wordmark span { color: #0FB5AE; }

    .scene-layer {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lovio-frame {
      position: relative;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 28px;
      border: 2px solid rgba(255, 255, 255, 0.98);
      box-shadow:
        0 48px 110px -22px rgba(15, 23, 42, 0.24),
        0 18px 42px -12px rgba(0, 85, 255, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
      overflow: hidden;
    }
    .lovio-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grad-text {
      background: linear-gradient(95deg, #0055FF 0%, #0FB5AE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    .glass-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.12);
      font-weight: 800;
      font-size: 20px;
      color: #0F172A;
    }

    .logo-tile {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      background: #FFFFFF;
      border: 1px solid rgba(15, 23, 42, 0.07);
      box-shadow: 0 22px 46px rgba(15, 23, 42, 0.11);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
    }
    .logo-tile img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      display: block;
    }
    .logo-tile span {
      font-size: 13px;
      font-weight: 800;
      color: #0F172A;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="sun-beam" id="beam1" style="top:-360px;left:340px;"></div>
    <div class="sun-beam" id="beam2" style="top:-320px;left:1080px;"></div>

    <div class="corner-brand" id="corner-brand">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
        <rect x="2" y="3" width="29" height="21" rx="3" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2.2"/>
        <rect x="4.5" y="5.5" width="24" height="16" rx="1.5" fill="#0B1F3A"/>
        <rect x="6" y="7" width="4" height="2" fill="#0FB5AE"/>
        <path d="M9.5 11.5V15.5H23.5V11.5" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="square"/>
        <polygon points="16.5,17 18.7,19.2 16.5,21.4 14.3,19.2" fill="#E0A526"/>
        <rect x="13.5" y="24" width="6" height="4" fill="#0B1F3A"/>
        <rect x="10" y="28" width="13" height="2.6" fill="#0B1F3A"/>
      </svg>
      <div class="corner-wordmark">be<span>digital</span></div>
    </div>

    <div class="scene-layer" id="scene-root"></div>
  </div>

  <script>
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const easeOutExpo = (x) => {
      const t = clamp(x, 0, 1);
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    };
    const easeInOutCubic = (x) => {
      const t = clamp(x, 0, 1);
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };
    const springEase = (x) => {
      const t = clamp(x, 0, 1);
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };
    const esc = (s) =>
      String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    function animatedBedigitalLogo(size = 120, t = 1) {
      const frameScale = springEase(t / 0.32);
      const baDash = clamp((t - 0.14) / 0.28, 0, 1);
      const nuqtaScale = t < 0.32 ? 0 : springEase((t - 0.32) / 0.28);
      const glow = 0.35 + 0.35 * Math.sin(t * 6);
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 36 36" fill="none" style="flex-shrink:0;filter:drop-shadow(0 14px 28px rgba(15,181,174,${glow.toFixed(2)}));transform:scale(${frameScale.toFixed(4)})">
          <rect x="4" y="6" width="29" height="21" rx="3" fill="#0FB5AE" fill-opacity="0.22"/>
          <rect x="2" y="3" width="29" height="21" rx="3" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2.1"/>
          <rect x="4.5" y="5.5" width="24" height="16" rx="1.5" fill="#0B1F3A"/>
          <rect x="6" y="7" width="${(4.5 * baDash).toFixed(2)}" height="2" fill="#0FB5AE"/>
          <path d="M9.5 11.5V15.5H23.5V11.5" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="square"
            stroke-dasharray="28" stroke-dashoffset="${((1 - baDash) * 28).toFixed(2)}"/>
          <polygon points="16.5,17 19.1,19.6 16.5,22.2 13.9,19.6" fill="#E0A526"
            style="transform-origin:16.5px 19.6px;transform:scale(${nuqtaScale.toFixed(3)})"/>
          <rect x="13.5" y="24" width="6" height="4" fill="#0B1F3A"/>
          <rect x="10" y="28" width="13" height="2.6" fill="#0B1F3A"/>
        </svg>`;
    }

    window.__frameImgLoaded = new Map();
    async function preloadDataUri(uri) {
      if (!uri || window.__frameImgLoaded.get(uri) === true) return;
      await new Promise((res) => {
        const im = new Image();
        im.onload = () => { window.__frameImgLoaded.set(uri, true); res(); };
        im.onerror = res;
        im.src = uri;
      });
    }

    window.renderFrame = async function ({
      lang,
      scene,
      logos,
      logoUris,
      localTime,
      globalProgress,
      liveFrameDataUri,
    }) {
      await preloadDataUri(liveFrameDataUri);

      const isAr = lang === "ar";
      const dir = isAr ? "rtl" : "ltr";
      const dur = Math.max(1.2, scene.duration_s || 4.0);
      const enter = easeOutExpo(localTime / 0.24);
      const exit = localTime > dur - 0.16 ? easeOutExpo((dur - localTime) / 0.16) : 1;
      const alpha = clamp(Math.min(enter * 1.15, exit), 0, 1);

      document.getElementById("beam1").style.left = `${300 + Math.sin(globalProgress * 4) * 90}px`;
      document.getElementById("beam2").style.left = `${1060 + Math.cos(globalProgress * 3) * 110}px`;

      const tpl = scene.template;
      const cornerBrand = document.getElementById("corner-brand");
      cornerBrand.style.display = tpl === "lovio_logo_reveal" || tpl === "lovio_end_card" ? "none" : "flex";

      const root = document.getElementById("scene-root");

      // 1. Animated bedigital Logo Sting -> EGY-SCOUT Coach Pro (Full-centered Lovio intro)
      if (tpl === "lovio_logo_reveal") {
        const morphSlide = easeOutExpo((localTime - 0.44) / 0.42);
        const pillO = easeOutExpo((localTime - 0.68) / 0.34);
        const haloScale = 0.8 + 0.45 * easeOutExpo(localTime / 1.1);
        root.innerHTML = `
          <div style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:${alpha};">
            <div style="position:absolute;width:640px;height:640px;border-radius:9999px;background:radial-gradient(circle,rgba(15,181,174,0.22),rgba(0,85,255,0.08),transparent 72%);filter:blur(40px);transform:scale(${haloScale.toFixed(3)});pointer-events:none;"></div>
            <div dir="ltr" style="position:relative;z-index:2;display:flex;align-items:center;gap:26px;">
              ${animatedBedigitalLogo(126, localTime)}
              <div style="overflow:hidden;max-width:${(morphSlide * 1020).toFixed(0)}px;white-space:nowrap;">
                <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:80px;font-weight:800;letter-spacing:-0.03em;color:#0F172A;line-height:1.05;">
                  EGY-SCOUT <span class="grad-text">Coach Pro</span>
                </div>
              </div>
            </div>
            <div dir="${dir}" class="glass-pill" style="opacity:${pillO};transform:translateY(${((1 - pillO) * 14).toFixed(1)}px);font-size:23px;padding:12px 30px;">
              <span style="width:10px;height:10px;border-radius:9999px;background:#0FB5AE;display:inline-block;"></span>
              <span>${esc(scene.pill)}</span>
            </div>
          </div>`;
        return;
      }

      // 2. TRUE Lovio Centered Curly-Brace Real Official HD Logos -> 86% Centered Live Hub Frame
      if (tpl === "lovio_multi_leagues") {
        const splitAt = 2.0;
        if (localTime < splitAt) {
          const spread = easeOutExpo(localTime / 0.48);
          const titleS = springEase(localTime / 0.34);
          const allLogos = logos || [];
          const row1 = allLogos.slice(0, 6);  // 6 League official HD PNGs (Egypt + Big 5)
          const row2 = allLogos.slice(6, 15); // 9 Top Club official HD PNGs
          const renderTile = (item, idx, delayBase) => {
            const p = springEase((localTime - delayBase - idx * 0.04) / 0.30);
            const o = clamp((localTime - delayBase - idx * 0.04) / 0.14, 0, 1);
            const floatY = Math.sin(localTime * 3.4 + idx * 0.7) * 5;
            const uri = (logoUris && logoUris[item.id]) || "";
            return `
              <div class="logo-tile" style="opacity:${o};transform:translateY(${((1 - p) * 26 + floatY).toFixed(1)}px) scale(${(0.84 + 0.16 * p).toFixed(3)});">
                ${uri ? `<img src="${uri}" alt="${esc(item.label)}" />` : ""}
                <span>${esc(isAr ? item.label : item.label_en)}</span>
              </div>`;
          };
          root.innerHTML = `
            <div dir="${dir}" style="width:1760px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:${alpha};text-align:center;">
              <div style="font-size:58px;font-weight:900;color:#0F172A;transform:scale(${(0.92 + 0.08 * titleS).toFixed(3)});">
                <span class="grad-text">${esc(scene.flash)}</span>
              </div>
              <div dir="ltr" style="display:flex;align-items:center;justify-content:center;gap:${(16 + spread * 14).toFixed(1)}px;">
                <span style="font-family:'Plus Jakarta Sans';font-size:210px;font-weight:200;color:#0FB5AE;opacity:${spread};line-height:0.8;">{</span>
                <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
                  <div style="display:flex;align-items:center;justify-content:center;gap:18px;">
                    ${row1.map((c, idx) => renderTile(c, idx, 0.06)).join("")}
                  </div>
                  <div style="display:flex;align-items:center;justify-content:center;gap:14px;">
                    ${row2.map((c, idx) => renderTile(c, idx, 0.24)).join("")}
                  </div>
                </div>
                <span style="font-family:'Plus Jakarta Sans';font-size:210px;font-weight:200;color:#0055FF;opacity:${spread};line-height:0.8;">}</span>
              </div>
              <div class="glass-pill" style="font-size:21px;">
                <span style="width:9px;height:9px;border-radius:9999px;background:#0055FF;"></span>
                <span>${esc(scene.pill)}</span>
              </div>
            </div>`;
        } else {
          const tLive = localTime - splitAt;
          const sc = 0.94 + 0.06 * easeOutExpo(tLive / 0.34);
          root.innerHTML = `
            <div dir="${dir}" style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:${alpha};">
              <div class="glass-pill" style="font-size:20px;padding:9px 24px;">
                <span style="width:9px;height:9px;border-radius:9999px;background:#0FB5AE;"></span>
                <span>${esc(scene.flash)}</span>
              </div>
              <div class="lovio-frame" style="width:1650px;height:860px;transform:scale(${sc.toFixed(4)});">
                <img src="${liveFrameDataUri}" alt="" style="object-position:top center;" />
              </div>
            </div>`;
        }
        return;
      }

      // 3. TRUE Lovio Centered Glowing AI Prompt Bar -> 88% Centered Live 3-4-2-1 Pitch
      if (tpl === "lovio_prompt_live") {
        const prompt = scene.prompt || "";
        const promptEnd = 1.25;
        if (localTime < promptEnd) {
          const frac = clamp(localTime / 1.0, 0, 1);
          const chars = Math.max(1, Math.floor(prompt.length * frac));
          const sc = 0.9 + 0.1 * springEase(localTime / 0.32);
          root.innerHTML = `
            <div dir="${dir}" style="width:1440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:${alpha};transform:scale(${sc.toFixed(4)});text-align:center;">
              <div style="font-size:62px;font-weight:900;color:#0F172A;">
                <span class="grad-text">${esc(scene.flash)}</span>
              </div>
              <div style="width:980px;padding:24px 32px;border-radius:9999px;background:rgba(255,255,255,0.92);backdrop-filter:blur(18px);border:2px solid rgba(15,181,174,0.7);box-shadow:0 30px 76px rgba(0,85,255,0.18);display:flex;align-items:center;justify-content:space-between;gap:16px;">
                <span style="font-size:32px;font-weight:800;color:#0F172A;">${esc(prompt.slice(0, chars))}<span style="color:#0FB5AE;">|</span></span>
                <span style="padding:11px 28px;border-radius:9999px;background:linear-gradient(95deg,#0055FF,#0FB5AE);color:#FFFFFF;font-size:21px;font-weight:800;">AI</span>
              </div>
            </div>`;
        } else {
          const tLive = localTime - promptEnd;
          const sc = 0.95 + 0.05 * easeOutExpo(tLive / 0.34);
          const camZoom = 1.0 + 0.06 * easeInOutCubic(tLive / Math.max(0.5, dur - promptEnd));
          root.innerHTML = `
            <div dir="${dir}" style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:${alpha};">
              <div class="glass-pill" style="font-size:20px;padding:9px 24px;">
                <span style="width:9px;height:9px;border-radius:9999px;background:#0FB5AE;"></span>
                <span>3-4-2-1 · AI Live</span>
              </div>
              <div class="lovio-frame" style="width:1690px;height:870px;transform:scale(${sc.toFixed(4)});">
                <img src="${liveFrameDataUri}" alt="" style="object-position:center center;transform:scale(${camZoom.toFixed(4)});" />
              </div>
            </div>`;
        }
        return;
      }

      // 4. TRUE Lovio 88% Full-Centered 3-Phase Live Morph (NO 2-Column Sidebar, Identical Smoothness in AR & EN)
      if (tpl === "lovio_phases_live") {
        const flashEnd = 0.95;
        const phases = scene.phases || [];
        if (localTime < flashEnd) {
          const sc = 0.9 + 0.1 * springEase(localTime / 0.3);
          root.innerHTML = `
            <div dir="${dir}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:${alpha};transform:scale(${sc.toFixed(4)});text-align:center;">
              <div style="font-size:66px;font-weight:900;color:#0F172A;">
                <span class="grad-text">${esc(scene.flash)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:14px;">
                ${phases
                  .map(
                    (ph) =>
                      `<div class="glass-pill" style="font-size:22px;padding:11px 24px;">${esc(ph)}</div>`
                  )
                  .join("")}
              </div>
            </div>`;
        } else {
          const tLive = localTime - flashEnd;
          const frac = clamp(tLive / Math.max(0.5, dur - flashEnd), 0, 1);
          // Match capture_live_clips timings: 0..15% Possession, 15..33% Attack, 33..51% Defense, 51..100% Live Smooth Morph
          const activeIdx = frac < 0.16 ? 0 : frac < 0.34 ? 1 : frac < 0.52 ? 2 : Math.floor(((frac - 0.52) / 0.48) * 3) % 3;
          const sc = 0.95 + 0.05 * easeOutExpo(tLive / 0.32);
          root.innerHTML = `
            <div dir="${dir}" style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:${alpha};">
              <div style="display:flex;align-items:center;gap:12px;">
                ${phases
                  .map((ph, idx) => {
                    const isAct = idx === activeIdx;
                    return `
                      <div class="glass-pill" style="
                        font-size:19px;
                        padding:9px 22px;
                        background:${isAct ? "linear-gradient(95deg,#0055FF,#0FB5AE)" : "rgba(255,255,255,0.88)"};
                        color:${isAct ? "#FFFFFF" : "#334155"};
                        border:${isAct ? "none" : "1px solid rgba(15,23,42,0.08)"};
                        transform:scale(${isAct ? 1.06 : 0.98});
                      ">${esc(ph)}</div>`;
                  })
                  .join("")}
              </div>
              <div class="lovio-frame" style="width:1690px;height:875px;transform:scale(${sc.toFixed(4)});">
                <img src="${liveFrameDataUri}" alt="" style="object-position:center center;transform:scale(1.04);" />
              </div>
            </div>`;
        }
        return;
      }

      // 5. TRUE Lovio 86% Full-Centered Formats (5v5->11v11) + Editable Player Roles + Training & Admin
      if (tpl === "lovio_formats_live") {
        const badges = scene.badges || [];
        const sc = 0.94 + 0.06 * easeOutExpo(localTime / 0.34);
        root.innerHTML = `
          <div dir="${dir}" style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:${alpha};">
            <div style="display:flex;align-items:center;gap:14px;">
              ${badges
                .map((b, idx) => {
                  const o = clamp((localTime - idx * 0.12) / 0.22, 0, 1);
                  return `<div class="glass-pill" style="font-size:19px;padding:9px 22px;opacity:${o};">${esc(b)}</div>`;
                })
                .join("")}
            </div>
            <div class="lovio-frame" style="width:1650px;height:860px;transform:scale(${sc.toFixed(4)});">
              <img src="${liveFrameDataUri}" alt="" style="object-position:top center;" />
            </div>
          </div>`;
        return;
      }

      // 6. Full Alpha/Beta Video Analysis Studio — Clear Flash + 84% Centered Live Footage + Bottom Feature Pill Strip
      if (tpl === "lovio_alpha_live") {
        const flashEnd = 1.05;
        const feats = scene.features || [];
        if (localTime < flashEnd) {
          const sc = 0.9 + 0.1 * springEase(localTime / 0.32);
          root.innerHTML = `
            <div dir="${dir}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:${alpha};transform:scale(${sc.toFixed(4)});text-align:center;">
              <div class="glass-pill" style="background:#0F172A;color:#FFFFFF;border:none;font-size:21px;padding:10px 26px;">
                ${esc(scene.flash)}
              </div>
              <div style="font-size:58px;font-weight:900;color:#0F172A;">
                <span class="grad-text">${isAr ? "تحليل الفيديو التكتيكي بالـ AI" : "AI Tactical Video Analysis"}</span>
              </div>
            </div>`;
        } else {
          const tLive = localTime - flashEnd;
          const sc = 0.95 + 0.05 * easeOutExpo(tLive / 0.32);
          root.innerHTML = `
            <div dir="${dir}" style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:${alpha};">
              <div class="glass-pill" style="background:#0F172A;color:#FFFFFF;border:none;font-size:18px;padding:8px 22px;">
                ${esc(scene.flash)}
              </div>
              <div class="lovio-frame" style="width:1610px;height:800px;background:#0B1220;transform:scale(${sc.toFixed(4)});">
                <img src="${liveFrameDataUri}" alt="" style="object-position:center center;transform:scale(1.03);" />
              </div>
              <div style="display:flex;align-items:center;gap:12px;">
                ${feats
                  .map((f, i) => {
                    const o = clamp((tLive - i * 0.14) / 0.22, 0, 1);
                    return `<div class="glass-pill" style="font-size:18px;padding:8px 20px;opacity:${o};">${esc(f)}</div>`;
                  })
                  .join("")}
              </div>
            </div>`;
        }
        return;
      }

      // 7. Clean Bright Lovio Outro
      const sc = springEase(localTime / 0.34);
      const subO = easeOutExpo((localTime - 0.24) / 0.28);
      root.innerHTML = `
